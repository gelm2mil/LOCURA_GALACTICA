
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030611">
<title>LOCURA GALÁCTICA — Laboratorio de Combate</title>

<style>
* { box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #030611;
    color: #00eaff;
    font-family: Arial, sans-serif;
}

#juego {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
}

#interfaz {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 2;
    padding: 12px 16px;
    background: rgba(2,10,25,.88);
    border: 1px solid #00eaff;
    border-radius: 8px;
    box-shadow: 0 0 15px #00eaff55;
    pointer-events: none;
    font-size: 13px;
}

#interfaz strong {
    color: white;
    letter-spacing: 2px;
}

#instrucciones {
    color: #b8dce9;
    font-size: 12px;
    line-height: 1.5;
    margin-top: 7px;
}

#volver {
    position: fixed;
    right: 15px;
    top: 15px;
    z-index: 3;
    padding: 10px 14px;
    color: #00eaff;
    background: #061426;
    border: 1px solid #00eaff;
    border-radius: 6px;
    text-decoration: none;
}
</style>
</head>

<body>

<div id="interfaz">
    <strong>LOCURA GALÁCTICA</strong>
    <div>GRUPTO — NAVEGACIÓN Y COMBATE</div>
    <div id="estadisticas">Objetivos: 0 | Destruidos: 0</div>
    <div id="estado">Estado: Explorando</div>

    <div id="instrucciones">
        Clic en espacio: navegar<br>
        Clic en enemigo: seleccionar y atacar<br>
        WASD o flechas: movimiento manual<br>
        Espacio: disparo manual
    </div>
</div>

<a id="volver" href="index.html">SALIR</a>

<canvas id="juego"></canvas>

<script>
"use strict";

const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d");

const estadisticas = document.getElementById("estadisticas");
const estado = document.getElementById("estado");

let ancho, alto;
let disparos = [];
let enemigos = [];
let particulas = [];
let estrellas = [];
let destruidos = 0;
let ultimoDisparo = 0;

const teclas = {};

const nave = {
    x: 0,
    y: 0,
    angulo: 0,
    velocidad: 0,
    velocidadMaxima: 4.2,
    aceleracion: 0.13,
    frenado: 0.94,
    destinoX: null,
    destinoY: null,
    objetivo: null
};

const mouse = { x: 0, y: 0 };

function ajustar() {
    const escala = Math.min(window.devicePixelRatio || 1, 2);

    ancho = window.innerWidth;
    alto = window.innerHeight;

    canvas.width = ancho * escala;
    canvas.height = alto * escala;

    ctx.setTransform(escala, 0, 0, escala, 0, 0);

    if (!nave.x) {
        nave.x = ancho / 2;
        nave.y = alto / 2;
    }

    estrellas = Array.from({length: 130}, () => ({
        x: Math.random() * ancho,
        y: Math.random() * alto,
        r: Math.random() * 1.4 + .3
    }));
}

window.addEventListener("resize", ajustar);
ajustar();

function crearEnemigo() {
    const lado = Math.floor(Math.random() * 4);
    let x = 0, y = 0;

    if (lado === 0) {
        x = Math.random() * ancho;
        y = -30;
    }

    if (lado === 1) {
        x = ancho + 30;
        y = Math.random() * alto;
    }

    if (lado === 2) {
        x = Math.random() * ancho;
        y = alto + 30;
    }

    if (lado === 3) {
        x = -30;
        y = Math.random() * alto;
    }

    enemigos.push({
        x, y,
        vida: 3,
        radio: 17,
        velocidad: 0.55 + Math.random() * 0.35,
        destruido: false
    });
}

for (let i = 0; i < 6; i++) crearEnemigo();

window.addEventListener("keydown", e => {
    teclas[e.key.toLowerCase()] = true;

    if (
        ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "]
        .includes(e.key)
    ) {
        e.preventDefault();
    }

    if (e.code === "Space") disparar();
});

window.addEventListener("keyup", e => {
    teclas[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener("contextmenu", e => {
    e.preventDefault();
});

canvas.addEventListener("mousedown", e => {
    if (e.button !== 0) return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Buscar si el clic corresponde a un enemigo.
    let encontrado = null;

    for (const enemigo of enemigos) {
        const distancia = Math.hypot(
            x - enemigo.x,
            y - enemigo.y
        );

        if (distancia < enemigo.radio + 10) {
            encontrado = enemigo;
            break;
        }
    }

    if (encontrado) {
        nave.objetivo = encontrado;
        nave.destinoX = null;
        nave.destinoY = null;
        estado.textContent = "Estado: Objetivo seleccionado";
    } else {
        nave.objetivo = null;
        nave.destinoX = x;
        nave.destinoY = y;
        estado.textContent = "Estado: Navegando";
    }
});

function disparar() {
    const angulo = nave.angulo;
    const distancia = 27;

    disparos.push({
        x: nave.x + Math.cos(angulo) * distancia,
        y: nave.y + Math.sin(angulo) * distancia,
        vx: Math.cos(angulo) * 12,
        vy: Math.sin(angulo) * 12,
        vida: 55,
        gastado: false
    });
}

function explosion(x, y, color) {
    for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = Math.random() * 4 + 1;

        particulas.push({
            x, y,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v,
            vida: 25,
            color
        });
    }
}

// Giro progresivo sin saltos bruscos.
function girarHacia(destino) {
    let diferencia = destino - nave.angulo;

    while (diferencia > Math.PI) {
        diferencia -= Math.PI * 2;
    }

    while (diferencia < -Math.PI) {
        diferencia += Math.PI * 2;
    }

    nave.angulo += Math.max(
        -0.09,
        Math.min(0.09, diferencia)
    );
}

function actualizarMovimiento() {

    let movimientoManual = false;

    let dx = 0;
    let dy = 0;

    if (teclas["w"] || teclas["arrowup"]) dy--;
    if (teclas["s"] || teclas["arrowdown"]) dy++;
    if (teclas["a"] || teclas["arrowleft"]) dx--;
    if (teclas["d"] || teclas["arrowright"]) dx++;

    if (dx !== 0 || dy !== 0) {
        movimientoManual = true;

        nave.destinoX = null;
        nave.destinoY = null;
        nave.objetivo = null;

        const angulo = Math.atan2(dy, dx);

        girarHacia(angulo);

        nave.velocidad = Math.min(
            nave.velocidad + nave.aceleracion,
            nave.velocidadMaxima
        );

        nave.x += Math.cos(nave.angulo) * nave.velocidad;
        nave.y += Math.sin(nave.angulo) * nave.velocidad;

        estado.textContent = "Estado: Movimiento manual";
    }

    if (!movimientoManual && nave.objetivo &&
        enemigos.includes(nave.objetivo)) {

        const e = nave.objetivo;

        const distancia = Math.hypot(
            e.x - nave.x,
            e.y - nave.y
        );

        girarHacia(
            Math.atan2(e.y - nave.y, e.x - nave.x)
        );

        // Mantener una distancia de combate.
        if (distancia > 230) {
            nave.velocidad = Math.min(
                nave.velocidad + nave.aceleracion,
                nave.velocidadMaxima
            );

            nave.x += Math.cos(nave.angulo) * nave.velocidad;
            nave.y += Math.sin(nave.angulo) * nave.velocidad;
        } else {
            nave.velocidad *= nave.frenado;
        }

        // Ataque automático.
        if (distancia < 650 &&
            performance.now() - ultimoDisparo > 350) {

            disparar();
            ultimoDisparo = performance.now();
        }

        estado.textContent = "Estado: Atacando objetivo";
    }

    else if (!movimientoManual &&
        nave.destinoX !== null &&
        nave.destinoY !== null) {

        const dx = nave.destinoX - nave.x;
        const dy = nave.destinoY - nave.y;
        const distancia = Math.hypot(dx, dy);

        if (distancia > 9) {
            girarHacia(Math.atan2(dy, dx));

            nave.velocidad = Math.min(
                nave.velocidad + nave.aceleracion,
                nave.velocidadMaxima
            );

            const avance = Math.min(nave.velocidad, distancia);

            nave.x += Math.cos(nave.angulo) * avance;
            nave.y += Math.sin(nave.angulo) * avance;

        } else {
            nave.velocidad *= nave.frenado;

            if (nave.velocidad < 0.12) {
                nave.velocidad = 0;
                nave.destinoX = null;
                nave.destinoY = null;

                estado.textContent = "Estado: En posición";
            }
        }
    }

    else if (!movimientoManual) {
        nave.velocidad *= nave.frenado;

        if (nave.velocidad < 0.08) {
            nave.velocidad = 0;
        }
    }

    nave.x = Math.max(25, Math.min(ancho - 25, nave.x));
    nave.y = Math.max(25, Math.min(alto - 25, nave.y));
}

function actualizar() {

    actualizarMovimiento();

    disparos.forEach(d => {
        d.x += d.vx;
        d.y += d.vy;
        d.vida--;
    });

    disparos = disparos.filter(d => d.vida > 0);

    enemigos.forEach(e => {

        const a = Math.atan2(
            nave.y - e.y,
            nave.x - e.x
        );

        e.x += Math.cos(a) * e.velocidad;
        e.y += Math.sin(a) * e.velocidad;

        disparos.forEach(d => {
            const distancia = Math.hypot(
                d.x - e.x,
                d.y - e.y
            );

            if (distancia < e.radio + 4 && !d.gastado) {
                d.gastado = true;
                e.vida--;

                explosion(d.x, d.y, "#00eaff");

                if (e.vida <= 0 && !e.destruido) {
                    e.destruido = true;
                    destruidos++;

                    explosion(e.x, e.y, "#ff2b91");

                    if (nave.objetivo === e) {
                        nave.objetivo = null;
                        estado.textContent = "Estado: Objetivo destruido";
                    }
                }
            }
        });
    });

    enemigos = enemigos.filter(e => !e.destruido);

    disparos = disparos.filter(d => !d.gastado);

    if (enemigos.length < 6) crearEnemigo();

    particulas.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vida--;
    });

    particulas = particulas.filter(p => p.vida > 0);

    estadisticas.textContent =
        `Objetivos: ${enemigos.length} | Destruidos: ${destruidos}`;
}

function dibujarNave() {

    ctx.save();
    ctx.translate(nave.x, nave.y);
    ctx.rotate(nave.angulo);

    // Propulsores: reaccionan a la velocidad.
    const intensidad = nave.velocidad / nave.velocidadMaxima;

    ctx.shadowBlur = 15 + intensidad * 20;
    ctx.shadowColor = "#00ffc8";
    ctx.fillStyle = "#00ffc8";

    ctx.beginPath();
    ctx.moveTo(-17, -8);
    ctx.lineTo(-34 - intensidad * 12, 0);
    ctx.lineTo(-17, 8);
    ctx.fill();

    // Cuerpo de GRUPTO.
    ctx.shadowColor = "#00eaff";
    ctx.shadowBlur = 20;
    ctx.fillStyle = "#9baebc";
    ctx.strokeStyle = "#00eaff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(27, 0);
    ctx.lineTo(8, -11);
    ctx.lineTo(-13, -9);
    ctx.lineTo(-22, 0);
    ctx.lineTo(-13, 9);
    ctx.lineTo(8, 11);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Núcleo frontal.
    ctx.fillStyle = "#ff2b91";
    ctx.shadowColor = "#ff2b91";

    ctx.beginPath();
    ctx.arc(12, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function dibujarEnemigo(e) {

    ctx.save();
    ctx.translate(e.x, e.y);

    ctx.shadowBlur = 18;
    ctx.shadowColor = "#ff2b91";
    ctx.fillStyle = "#58113c";
    ctx.strokeStyle = "#ff2b91";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(0, 0, e.radio, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fff";

    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();

    // Indicador del objetivo seleccionado.
    if (nave.objetivo === e) {
        ctx.strokeStyle = "#00eaff";
        ctx.lineWidth = 2;
        ctx.shadowColor = "#00eaff";

        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.stroke();
    }

    ctx.restore();
}

function dibujar() {

    ctx.clearRect(0, 0, ancho, alto);

    ctx.fillStyle = "#030611";
    ctx.fillRect(0, 0, ancho, alto);

    // Estrellas.
    estrellas.forEach(e => {
        ctx.fillStyle = "rgba(180,230,255,.65)";
        ctx.fillRect(e.x, e.y, e.r, e.r);
    });

    // Punto de navegación.
    if (nave.destinoX !== null) {
        ctx.save();

        ctx.strokeStyle = "#00eaff";
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#00eaff";

        ctx.beginPath();
        ctx.arc(nave.destinoX, nave.destinoY, 9, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(nave.destinoX - 14, nave.destinoY);
        ctx.lineTo(nave.destinoX + 14, nave.destinoY);
        ctx.moveTo(nave.destinoX, nave.destinoY - 14);
        ctx.lineTo(nave.destinoX, nave.destinoY + 14);
        ctx.stroke();

        ctx.restore();
    }

    // Láseres.
    disparos.forEach(d => {
        ctx.save();

        ctx.shadowBlur = 18;
        ctx.shadowColor = "#00eaff";
        ctx.strokeStyle = "#00eaff";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(d.x - d.vx, d.y - d.vy);
        ctx.lineTo(d.x, d.y);
        ctx.stroke();

        ctx.restore();
    });

    enemigos.forEach(dibujarEnemigo);

    // Explosiones.
    particulas.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.vida / 25);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
    });

    dibujarNave();
}

function bucle() {
    actualizar();
    dibujar();
    requestAnimationFrame(bucle);
}

bucle();

</script>
</body>
</html>
