<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Space Shooter Tech Demo</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Generar fondo de estrellas
const stars = Array.from({ length: 150 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  size: Math.random() * 2
}));

// Estado de la Nave
const ship = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  vx: 0,
  vy: 0,
  angle: 0,
  speed: 0.15,
  friction: 0.98
};

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let mouseX = ship.x;
let mouseY = ship.y;
window.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

function update() {
  // Orientar la nave hacia el mouse
  const dx = mouseX - ship.x;
  const dy = mouseY - ship.y;
  ship.angle = Math.atan2(dy, dx);

  // Aceleración hacia adelante con 'W' o Flecha Arriba
  if (keys['w'] || keys['arrowup']) {
    ship.vx += Math.cos(ship.angle) * ship.speed;
    ship.vy += Math.sin(ship.angle) * ship.speed;
  }

  // Aplicar inercia/fricción espacial
  ship.vx *= ship.friction;
  ship.vy *= ship.friction;

  ship.x += ship.vx;
  ship.y += ship.vy;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Dibujar estrellas
  ctx.fillStyle = '#ffffff';
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

  // Dibujar Nave
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);

  // Triángulo estilizado de la nave
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.lineTo(-10, -10);
  ctx.lineTo(-5, 0);
  ctx.lineTo(-10, 10);
  ctx.closePath();

  ctx.fillStyle = '#00e5ff';
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
